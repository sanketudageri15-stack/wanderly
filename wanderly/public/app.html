<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wanderly · Smart Travel & Budget Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script>
    window.FALLBACK_IMG = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient></defs><rect width="800" height="500" fill="url(#g)"/></svg>');
  </script>
</head>
<body>
  <div class="blob b1"></div><div class="blob b2"></div>

  <aside class="sidebar" id="sidebar">
    <a class="brand" href="/">
      <span class="logo">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 3 10.5l7 2.5 2.5 7z"/></svg>
      </span>
      <span>Wanderly</span>
    </a>
    <nav id="nav"></nav>
    <a class="nav-link" href="/" style="margin-top:-12px"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18 9 12l6-6"/></svg><span>Back to website</span></a>
    <div class="side-card">
      <img src="https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?auto=format&fit=crop&w=600&q=70" alt="" onerror="this.onerror=null;this.src=FALLBACK_IMG">
      <div class="sc-body">
        <b>Plan smarter</b>
        <p>Use the estimator to price a trip before you book.</p>
        <a class="btn btn-sm btn-white" href="#/estimate">Try estimator</a>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="search">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="globalSearch" placeholder="Search destinations or trips…" autocomplete="off">
      </div>
      <div class="top-right">
        <label class="cur-pick">Currency
          <select id="curSelect"></select>
        </label>
        <button class="btn btn-primary" data-act="new-trip">+ New trip</button>
        <div class="avatar" title="You">YO</div>
      </div>
    </header>
    <section id="view" class="view"></section>
  </main>

  <div id="modalRoot"></div>
  <div id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
